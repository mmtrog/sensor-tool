name: Collect & deploy

on:
  schedule:
    - cron: '17 1 * * *'   # 01:17 UTC = 08:17 giờ VN, mỗi ngày
  workflow_dispatch:
    inputs:
      collect:
        description: 'Thu thập dữ liệu mới trước khi build'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build.mjs', 'config.json']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect-deploy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
        run: npm run collect

      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
