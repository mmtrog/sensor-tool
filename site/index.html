<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Trends — Market Intelligence</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
      </div>
      <div>
        <h1>Game Trends</h1>
        <span class="meta" id="meta">Đang tải dữ liệu…</span>
      </div>
    </div>

    <div class="controls">
      <div class="seg" id="store" role="tablist" aria-label="Store">
        <button data-v="ios">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.96 6.33c.67-.81 1.12-1.94.99-3.07-.96.04-2.12.64-2.81 1.45-.61.71-1.15 1.86-1 2.97 1.07.08 2.16-.54 2.82-1.35"/></svg>
          App Store
        </button>
        <button data-v="android">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.61 1.814L13.793 12 3.61 22.186a.996.996 0 0 1-.61-.92V2.734a1 1 0 0 1 .61-.92zm10.89 10.893l2.302 2.302-10.937 6.333 8.635-8.635zm3.199-3.198l2.807 1.626a1 1 0 0 1 0 1.73l-2.808 1.626L15.206 12l2.493-2.491zM5.864 2.658L16.8 8.99l-2.302 2.302-8.634-8.634z"/></svg>
          Google Play
        </button>
      </div>

      <select id="region" aria-label="Khu vực"></select>

      <div class="seg" id="chart" role="tablist" aria-label="Bảng xếp hạng">
        <button data-v="free">Top Free</button>
        <button data-v="grossing">Top Grossing</button>
      </div>

      <select id="genre" aria-label="Thể loại"><option value="">Tất cả game</option></select>

      <button id="themeBtn" class="icon-btn" type="button" title="Đổi giao diện Sáng / Tối" aria-label="Đổi giao diện">
        <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="kpis" id="kpis" aria-label="Tổng quan nhanh"></section>

    <div class="toolbar">
      <div class="tabs" id="view" role="tablist">
        <button data-v="top">Bảng xếp hạng</button>
        <button data-v="rising">Đang lên (7 ngày)</button>
        <button data-v="new">Mới vào top</button>
        <button data-v="growth" id="growthTab">Tăng lượt cài</button>
      </div>
      <div class="filters">
        <div class="search-wrap">
          <svg class="search-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="q" type="search" placeholder="Tìm game / studio… (nhấn /)" aria-label="Tìm kiếm">
        </div>
        <button id="exportBtn" class="btn-outline" type="button" title="Xuất bảng hiện tại ra CSV">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          Xuất CSV
        </button>
      </div>
    </div>

    <div class="subbar">
      <p class="hint" id="hint"></p>
      <span class="count-pill" id="rowCount"></span>
    </div>

    <div class="table-wrap">
      <table id="tbl">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
    <p class="empty" id="empty" hidden>Không có game nào khớp bộ lọc.</p>
  </main>

  <dialog id="detail">
    <div class="dlg-bar">
      <span class="dlg-tag" id="dlgTag">Chi tiết game</span>
      <form method="dialog"><button class="close" aria-label="Đóng">×</button></form>
    </div>
    <div id="detailBody"></div>
    <div class="chart-panel">
      <div class="chart-title">Diễn biến thứ hạng</div>
      <div class="chart-box"><canvas id="histChart"></canvas></div>
    </div>
    <section id="listing"></section>
  </dialog>

  <footer>
    Dữ liệu: Apple iTunes RSS &amp; Lookup API, Google Play (scrape). Chỉ dùng nội bộ.
    Tăng trưởng iOS = số đánh giá tăng thêm (proxy cho lượt tải); Android = lượt cài tăng thêm.
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
